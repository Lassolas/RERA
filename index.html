<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RER A Live Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .title-area { display: flex; align-items: center; gap: 10px; }
        .logo { background: #e30613; color: white; font-weight: bold; padding: 5px 10px; border-radius: 4px; font-size: 20px; }
        
        /* Refresh Button Styling */
        .refresh-btn { background: #007aff; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 5px; }
        .refresh-btn:active { background: #0056b3; }
        .refresh-btn:disabled { background: #a2a2a2; cursor: not-allowed; }

        .status-box { padding: 12px; border-radius: 6px; border-left: 5px solid #ccc; background: #f9f9f9; min-height: 40px; }
        .status-ok { border-left-color: #2ecc71; background: #e8f8f0; }
        .status-alert { border-left-color: #e74c3c; background: #fdedec; }
        
        ul { padding-left: 0; list-style: none; margin: 0; }
        li { border-bottom: 1px solid #eee; padding: 10px 0; }
        li:last-child { border: none; }
        .date { color: #888; font-size: 12px; display: block; margin-bottom: 4px; }
        .footer { text-align: center; font-size: 11px; color: #aaa; margin-top: 20px; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-area">
            <div class="logo">A</div>
            <h2 style="margin:0;">Fil d'info RER A</h2>
        </div>
        <button class="refresh-btn" id="refreshBtn" onclick="fetchAllData()">🔄 Actualiser</button>
    </div>

    <div class="card">
        <h3>ℹ️ État de la Ligne (Live)</h3>
        <div id="primStatus" class="status-box">Cliquez sur Actualiser pour charger...</div>
    </div>

    <div class="card">
        <h3>💬 Derniers Signalements (@RER_A)</h3>
        <ul id="twitterFeed">
            <li class="loading">Aucun tweet chargé.</li>
        </ul>
    </div>

    <div class="footer">
        Statut : <span id="updateTime">Jamais mis à jour</span><br>
        Direct Client-Side Fetch via CORS Proxy
    </div>

    <script>
        let PRIM_API_KEY = localStorage.getItem('prim_key');
        if (!PRIM_API_KEY) {
            PRIM_API_KEY = prompt("Veuillez saisir votre clé d'API PRIM :");
            if (PRIM_API_KEY) { localStorage.setItem('prim_key', PRIM_API_KEY); }
        }
        
        const PRIM_URL = "https://prim.iledefrance-mobilites.fr/marketplace/disruptions_bulk/disruptions/v2";
        
        // 🔄 NEW resilient Twitter RSS mirror
        const TWITTER_RSS = "https://nitter.net/RER_A/rss"; 
        const CORS_PROXY = "https://api.allorigins.win/get?url=";

        async function fetchAllData() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.innerText = "⏳...";
            
            document.getElementById('primStatus').className = "status-box";
            document.getElementById('primStatus').innerHTML = "Chargement IDFM...";
            document.getElementById('twitterFeed').innerHTML = "<li>Chargement Twitter...</li>";

            await Promise.all([fetchPrimStatus(), fetchTwitterFeed()]);

            btn.disabled = false;
            btn.innerText = "🔄 Actualiser";
            document.getElementById('updateTime').innerText = new Date().toLocaleTimeString('fr-FR');
        }

        async function fetchPrimStatus() {
            const statusBox = document.getElementById('primStatus');
            try {
                // Fetch using the CORS proxy to guarantee headers don't get stripped by the phone browser
                const targetUrl = encodeURIComponent(PRIM_URL);
                const response = await fetch(`${CORS_PROXY}${targetUrl}`, {
                    headers: { "Target-URL-Header": "apikey", "Target-URL-Value": PRIM_API_KEY }
                });
                const wrapper = await response.json();
                
                // Parse the proxy content string back into actual JSON data
                const data = JSON.parse(wrapper.contents);
                const disruptions = data.disruptions || [];
                let alerts = [];

                disruptions.forEach(d => {
                    const fullDisruptionString = JSON.stringify(d).toLowerCase();
                    
                    // Super broad search: match standard internal IDs, RER A structural references, or plain text
                    if (
                        fullDisruptionString.includes("c01742") || 
                        fullDisruptionString.includes("rer a") || 
                        fullDisruptionString.includes("rera")
                    ) {
                        const title = d.title || "Incident / Travaux";
                        // Grab the message text safely
                        let msg = "Aucun détail disponible pour le moment.";
                        if (d.messages && d.messages.length > 0) {
                            msg = d.messages[0].text || d.messages[0].description || msg;
                        }
                        alerts.push(`<strong>⚠️ ${title}</strong>:<br>${msg}`);
                    }
                });

                if (alerts.length === 0) {
                    statusBox.className = "status-box status-ok";
                    statusBox.innerHTML = "✅ Aucun incident majeur répertorié sur l'API globale pour le RER A.";
                } else {
                    statusBox.className = "status-box status-alert";
                    statusBox.innerHTML = alerts.join("<br><br><hr style='border:0; border-top:1px dashed #e74c3c;'><br>");
                }

            } catch (err) {
                console.error(err);
                statusBox.innerHTML = `❌ Erreur de décodage ou de connexion à l'API IDFM.`;
            }
        }

        async function fetchTwitterFeed() {
            const feedContainer = document.getElementById('twitterFeed');
            try {
                const targetUrl = encodeURIComponent(TWITTER_RSS);
                const response = await fetch(`${CORS_PROXY}${targetUrl}`);
                const wrapper = await response.json();
                
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(wrapper.contents, "text/xml");
                const items = xmlDoc.getElementsByTagName("item");

                let htmlContent = "";
                const limit = Math.min(items.length, 5); // Show up to 5 updates
                
                if (limit === 0) {
                    feedContainer.innerHTML = "<li>Aucun tweet récent trouvé sur le flux miroir.</li>";
                    return;
                }

                for (let i = 0; i < limit; i++) {
                    const title = items[i].getElementsByTagName("description")[0]?.textContent || 
                                  items[i].getElementsByTagName("title")[0]?.textContent || "";
                    
                    let pubDate = items[i].getElementsByTagName("pubDate")[0]?.textContent || "";
                    // Quick clean up of time strings for cleaner look
                    pubDate = pubDate.replace("+0000", "").replace("GMT", "").trim();

                    // Filter out empty titles or links
                    if (title.trim().length > 5) {
                        htmlContent += `<li><span class="date">🕒 ${pubDate}</span><p style="margin:4px 0 0 0; font-size:14px; line-height:1.4;">${title}</p></li>`;
                    }
                }
                
                feedContainer.innerHTML = htmlContent || "<li>Aucune alerte textuelle lisible trouvée.</li>";

            } catch (err) {
                feedContainer.innerHTML = "<li>❌ Impossible de récupérer les tweets (Miroir RSS indisponible).</li>";
            }
        }

        window.onload = fetchAllData;
    </script>
</body>
</html>
