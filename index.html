<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon RER A (Châtelet - Val d'Europe)</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f0f2f5; 
            margin: 0; 
            padding: 15px; 
            color: #333; 
        }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            margin-bottom: 15px; 
        }
        .header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            margin-bottom: 20px; 
        }
        .title-area { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .logo { 
            background: #e30613; 
            color: white; 
            font-weight: bold; 
            padding: 5px 12px; 
            border-radius: 4px; 
            font-size: 22px; 
        }
        .refresh-btn { 
            background: #007aff; 
            color: white; 
            border: none; 
            padding: 10px 16px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 14px; 
        }
        .refresh-btn:active { background: #0056b3; }
        .refresh-btn:disabled { background: #a2a2a2; cursor: not-allowed; }

        .status-box { 
            padding: 15px; 
            border-radius: 8px; 
            border-left: 5px solid #ccc; 
            background: #f9f9f9; 
            font-size: 15px;
            line-height: 1.5;
        }
        .status-ok { border-left-color: #2ecc71; background: #e8f8f0; color: #1e7e34; }
        .status-alert { border-left-color: #e74c3c; background: #fdedec; color: #c0392b; }
        
        ul { padding-left: 0; list-style: none; margin: 0; }
        li { border-bottom: 1px solid #eee; padding: 12px 0; }
        li:last-child { border: none; }
        .date { color: #888; font-size: 11px; display: block; margin-bottom: 4px; }
        .footer { text-align: center; font-size: 11px; color: #aaa; margin-top: 20px; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-area">
            <div class="logo">A</div>
            <h2 style="margin:0; font-size: 20px;">Châtelet ➔ Val d'Europe</h2>
        </div>
        <button class="refresh-btn" id="refreshBtn" onclick="fetchAllData()">🔄 Actualiser</button>
    </div>

    <div class="card">
        <h3 style="margin-top:0; font-size:16px;">ℹ️ Châtelet ➔ Val d'Europe</h3>
        <div id="primStatusEst" class="status-box">Initialisation...</div>
    </div>

    <div class="card">
        <h3 style="margin-top:0; font-size:16px;">ℹ️ Val d'Europe ➔ Châtelet</h3>
        <div id="primStatusOuest" class="status-box">Initialisation...</div>
    </div>

    <div class="card">
        <h3 style="margin-top:0; font-size:16px;">💬 Signalements Bluesky (RER A)</h3>
        <ul id="socialFeed">
            <li class="loading">En attente de chargement...</li>
        </ul>
    </div>

    <div class="footer">
        Dernière synchro : <span id="updateTime">-</span><br>
        Données Île-de-France Mobilités & Bluesky
    </div>

    <script>
        let PRIM_API_KEY = localStorage.getItem('prim_key');
        if (!PRIM_API_KEY) {
            PRIM_API_KEY = prompt("Veuillez saisir votre clé d'API PRIM :");
            if (PRIM_API_KEY) {
                localStorage.setItem('prim_key', PRIM_API_KEY);
            }
        }

        const PRIM_URL = "https://prim.iledefrance-mobilites.fr/marketplace/disruptions_bulk/disruptions/v2";
        const CORS_PROXY = "https://corsproxy.io/?";

        async function fetchAllData() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.innerText = "⏳...";
            
            document.getElementById('primStatusEst').className = "status-box";
            document.getElementById('primStatusEst').innerHTML = "<span class='loading'>Chargement...</span>";
            document.getElementById('primStatusOuest').className = "status-box";
            document.getElementById('primStatusOuest').innerHTML = "<span class='loading'>Chargement...</span>";
            document.getElementById('socialFeed').innerHTML = "<li class='loading'>Recherche sur Bluesky...</li>";

            await Promise.all([fetchPrimStatus(), fetchBlueskyFeed()]);

            btn.disabled = false;
            btn.innerText = "🔄 Actualiser";
            document.getElementById('updateTime').innerText = new Date().toLocaleTimeString('fr-FR');
        }

        function renderStatusBox(boxId, alerts, labelOk) {
            const box = document.getElementById(boxId);
            const uniq = [...new Set(alerts)];
            if (uniq.length === 0) {
                box.className = "status-box status-ok";
                box.innerHTML = `✅ RAS. ${labelOk}`;
            } else {
                box.className = "status-box status-alert";
                box.innerHTML = uniq.join("<br><br><hr style='border:0;border-top:1px dashed #e74c3c;'><br>");
            }
        }

        async function fetchPrimStatus() {
            const boxEst   = document.getElementById('primStatusEst');
            const boxOuest = document.getElementById('primStatusOuest');

            if (!PRIM_API_KEY) {
                const warn = "⚠️ Clé API absente. Rechargez pour la renseigner.";
                boxEst.innerHTML = warn;
                boxOuest.innerHTML = warn;
                return;
            }

            try {
                const response = await fetch(`${CORS_PROXY}${encodeURIComponent(PRIM_URL)}`, {
                    headers: { "apikey": PRIM_API_KEY }
                });
                const data = await response.json();
                const disruptions = data.disruptions || [];

                const garesAxeEst = [
                    "châtelet", "chatelet", "les halles", "gare de lyon", "nation", "vincennes",
                    "fontenay", "val de fontenay", "neuilly", "neuilly-plaisance", "neuilly plaisance",
                    "bry", "bry-sur-marne", "bry sur marne", "noisy", "noisy-le-grand", "noisy le grand",
                    "mont d'est", "mont dest", "noisiel", "lognes", "torcy", "bussy", "bussy-saint-georges",
                    "bussy st georges", "val d'europe", "val deurope", "serris", "marne", "marne-la-vallée",
                    "marne la vallee", "chessy", "disney"
                ];

                // Keywords that indicate a specific direction
                const kwBanlieue = ["sens banlieue", "vers banlieue", "direction banlieue", "vers marne", "vers val d'europe", "vers chessy"];
                const kwParis    = ["sens paris", "vers paris", "direction paris", "retour paris", "vers châtelet", "vers chatelet"];

                let alertsEst = [], alertsOuest = [];

                disruptions.forEach(d => {
                    const title = (d.title || "").toLowerCase();
                    let msg = "";
                    if (d.messages && d.messages.length > 0) {
                        msg = d.messages[0].text || d.messages[0].description || "";
                    }
                    const fullText = (title + " " + msg).toLowerCase();
                    const objectsStr = JSON.stringify(d.impacted_objects || []);

                    const isRerA = objectsStr.includes("C01742") &&
                                   !title.startsWith("bus ") &&
                                   !title.startsWith("tram ");
                    if (!isRerA) return;

                    const hasMyGare = garesAxeEst.some(g => fullText.includes(g));
                    const isGeneral = fullText.includes("interrompu entre") ||
                                      fullText.includes("panne") ||
                                      fullText.includes("incident technique") ||
                                      fullText.includes("ralentissement");

                    let inZone = hasMyGare || isGeneral;
                    if ((fullText.includes("cergy") || fullText.includes("poissy") || fullText.includes("st-germain")) && !hasMyGare) {
                        inZone = false;
                    }
                    if (!inZone) return;

                    const entry = `<strong>⚠️ ${d.title || "Incident / Ralentissement"}</strong><br>${msg || "Aucun détail complémentaire."}`;

                    const isBanlieue = kwBanlieue.some(k => fullText.includes(k));
                    const isParis    = kwParis.some(k => fullText.includes(k));

                    if (!isBanlieue && !isParis) {
                        // No direction specified → affects both
                        alertsEst.push(entry);
                        alertsOuest.push(entry);
                    } else {
                        if (isBanlieue) alertsEst.push(entry);
                        if (isParis)    alertsOuest.push(entry);
                    }
                });

                renderStatusBox('primStatusEst',   alertsEst,   "Trafic régulier vers Val d'Europe.");
                renderStatusBox('primStatusOuest', alertsOuest, "Trafic régulier vers Châtelet.");

            } catch (err) {
                console.error(err);
                const errHtml = "❌ Erreur de connexion ou de clé API PRIM.";
                boxEst.className = boxOuest.className = "status-box status-alert";
                boxEst.innerHTML = boxOuest.innerHTML = errHtml;
            }
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.appendChild(document.createTextNode(text));
            return d.innerHTML;
        }

        async function fetchBlueskyFeed() {
            const feedContainer = document.getElementById('socialFeed');
            try {
                const response = await fetch(
                    "https://public.api.bsky.app/xrpc/app.bsky.feed.searchPosts?q=RER%20A&sort=latest&limit=8&lang=fr"
                );
                const data = await response.json();
                const posts = (data.posts || []).slice(0, 5);

                if (posts.length === 0) {
                    feedContainer.innerHTML = "<li>Aucun signalement récent sur Bluesky.</li>";
                    return;
                }

                let html = "";
                for (const post of posts) {
                    const text = escapeHtml(post.record?.text || "");
                    const handle = escapeHtml(post.author?.handle || "");
                    const dateStr = post.record?.createdAt
                        ? new Date(post.record.createdAt).toLocaleString('fr-FR')
                        : "";
                    html += `<li><span class="date">🕒 ${dateStr} — @${handle}</span><p style="margin:4px 0 0 0; font-size:14px; line-height:1.4;">${text}</p></li>`;
                }
                feedContainer.innerHTML = html;
            } catch (err) {
                console.error(err);
                feedContainer.innerHTML = "<li>❌ Impossible de charger les signalements Bluesky.</li>";
            }
        }

        window.onload = fetchAllData;
    </script>
</body>
</html>
