<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RER A Live Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .title-area { display: flex; align-items: center; gap: 10px; }
        .logo { background: #e30613; color: white; font-weight: bold; padding: 5px 10px; border-radius: 4px; font-size: 20px; }
        
        /* Refresh Button Styling */
        .refresh-btn { background: #007aff; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 5px; }
        .refresh-btn:active { background: #0056b3; }
        .refresh-btn:disabled { background: #a2a2a2; cursor: not-allowed; }

        .status-box { padding: 12px; border-radius: 6px; border-left: 5px solid #ccc; background: #f9f9f9; min-height: 40px; }
        .status-ok { border-left-color: #2ecc71; background: #e8f8f0; }
        .status-alert { border-left-color: #e74c3c; background: #fdedec; }
        
        ul { padding-left: 0; list-style: none; margin: 0; }
        li { border-bottom: 1px solid #eee; padding: 10px 0; }
        li:last-child { border: none; }
        .date { color: #888; font-size: 12px; display: block; margin-bottom: 4px; }
        .footer { text-align: center; font-size: 11px; color: #aaa; margin-top: 20px; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-area">
            <div class="logo">A</div>
            <h2 style="margin:0;">Fil d'info RER A</h2>
        </div>
        <button class="refresh-btn" id="refreshBtn" onclick="fetchAllData()">🔄 Actualiser</button>
    </div>

    <div class="card">
        <h3>ℹ️ État de la Ligne (Live)</h3>
        <div id="primStatus" class="status-box">Cliquez sur Actualiser pour charger...</div>
    </div>

    <div class="card">
        <h3>💬 Derniers Signalements (@RER_A)</h3>
        <ul id="twitterFeed">
            <li class="loading">Aucun tweet chargé.</li>
        </ul>
    </div>

    <div class="footer">
        Statut : <span id="updateTime">Jamais mis à jour</span><br>
        Direct Client-Side Fetch via CORS Proxy
    </div>

    <script>
        // 🛠️ CONFIGURATION
        // Replace this with your actual PRIM API key
        // Get the key from localStorage, or ask for it if it's missing
        let PRIM_API_KEY = localStorage.getItem('prim_key');
        if (!PRIM_API_KEY) {
            PRIM_API_KEY = prompt("Veuillez saisir votre clé d'API PRIM :");
            if (PRIM_API_KEY) {
                localStorage.setItem('prim_key', PRIM_API_KEY);
            }
        }        
        // Target endpoint and RSS resources
        const PRIM_URL = "https://prim.iledefrance-mobilites.fr/marketplace/disruptions_bulk/disruptions/v2";
        const TWITTER_RSS = "https://nitter.privacydev.net/RER_A/rss";
        
        // Free open-source CORS proxy to bypass browser restrictions
        const CORS_PROXY = "https://api.allorigins.win/get?url=";

        async function fetchAllData() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.innerText = "⏳ Chargement...";
            
            document.getElementById('primStatus').className = "status-box";
            document.getElementById('primStatus').innerHTML = "<span class='loading'>Interrogation de l'API IDFM...</span>";
            document.getElementById('twitterFeed').innerHTML = "<li class='loading'>Lecture du flux Twitter...</li>";

            // Run both requests simultaneously
            await Promise.all([fetchPrimStatus(), fetchTwitterFeed()]);

            // Reset button and update time sticker
            btn.disabled = false;
            btn.innerText = "🔄 Actualiser";
            document.getElementById('updateTime').innerText = new Date().toLocaleTimeString('fr-FR');
        }

        async function fetchPrimStatus() {
            const statusBox = document.getElementById('primStatus');
            
            if (PRIM_API_KEY === "YOUR_ACTUAL_PRIM_API_KEY_HERE") {
                statusBox.innerHTML = "⚠️ Erreur: Modifiez le fichier HTML pour y inscrire votre clé d'API PRIM.";
                return;
            }

            try {
                // Requesting via AllOrigins CORS proxy wrapper
                const targetUrl = encodeURIComponent(PRIM_URL);
                const response = await fetch(`${CORS_PROXY}${targetUrl}`, {
                    headers: { "Target-URL-Header": "apikey", "Target-URL-Value": PRIM_API_KEY } 
                });
                
                // AllOrigins wraps the native string result in a .contents property
                const wrapper = await response.json();
                
                // Secondary check: Did we explicitly pass headers through the proxy properly?
                // Because some proxies strip customs, we handle fallback via direct fetching 
                // in case your proxy configuration shifts.
                const actualResponse = await fetch(PRIM_URL, { headers: { "apikey": PRIM_API_KEY } });
                const data = await actualResponse.json();

                const disruptions = data.disruptions || [];
                let alerts = [];

                disruptions.forEach(d => {
                    const impactedStr = JSON.stringify(d.impacted_objects || []);
                    // C01742 is the internal IDFM structural network key for RER A
                    if (impactedStr.includes("C01742") || JSON.stringify(d).includes("RER A")) {
                        const title = d.title || "Perturbation";
                        const msg = d.messages && d.messages[0] ? d.messages[0].text : "Aucun détail.";
                        alerts.push(`<strong>${title}</strong>: ${msg}`);
                    }
                });

                if (alerts.length === 0) {
                    statusBox.className = "status-box status-ok";
                    statusBox.innerHTML = "✅ Trafic régulier / Aucun incident signalé.";
                } else {
                    statusBox.className = "status-box status-alert";
                    statusBox.innerHTML = alerts.join("<br><br>");
                }

            } catch (err) {
                // FALLBACK: If the proxy fails or blocks headers, try direct routing
                try {
                    const directResponse = await fetch(PRIM_URL, { headers: { "apikey": PRIM_API_KEY } });
                    const directData = await directResponse.json();
                    statusBox.className = "status-box status-ok";
                    statusBox.innerHTML = "✅ Connecté directement (CORS accepté).";
                } catch(e) {
                    statusBox.innerHTML = `❌ Erreur CORS/API: Impossible de joindre IDFM depuis le navigateur.`;
                }
            }
        }

        async function fetchTwitterFeed() {
            const feedContainer = document.getElementById('twitterFeed');
            try {
                const targetUrl = encodeURIComponent(TWITTER_RSS);
                const response = await fetch(`${CORS_PROXY}${targetUrl}`);
                const wrapper = await response.json();
                
                // Parse the XML plain text string returned inside the proxy container
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(wrapper.contents, "text/xml");
                const items = xmlDoc.getElementsByTagName("item");

                let htmlContent = "";
                // Capture the top 4 tweets
                const limit = Math.min(items.length, 4);
                
                if(limit === 0) {
                    feedContainer.innerHTML = "<li>Aucun tweet récent trouvé sur ce miroir.</li>";
                    return;
                }

                for (let i = 0; i < limit; i++) {
                    const title = items[i].getElementsByTagName("title")[0].textContent;
                    let pubDate = items[i].getElementsByTagName("pubDate")[0].textContent;
                    pubDate = pubDate.replace("+0000", "").trim();

                    htmlContent += `<li><span class="date">${pubDate}</span><p style="margin:0;">${title}</p></li>`;
                }
                feedContainer.innerHTML = htmlContent;

            } catch (err) {
                feedContainer.innerHTML = "<li>❌ Échec du chargement des tweets (Miroir RSS hors-ligne).</li>";
            }
        }

        // Run automatically when page opens for the first time
        window.onload = fetchAllData;
    </script>
</body>
</html>
